<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: use the whole iPhone screen, we pad for notch and home bar ourselves -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WG-App</title>
    <!-- icons come from docs/wg-app-icon/ (ADR 0014) -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />

    <!-- iPhone Home Screen app -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WG" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- same as --bg in src/index.css -->
    <meta name="theme-color" content="#f4f2fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121022" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
